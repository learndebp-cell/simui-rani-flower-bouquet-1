<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

  <title>🌹❤️ Simui Rani's Flower Bouquet ❤️🌹</title>

    <meta name="description"
          content="A beautiful flower bouquet made with love for Simui Rani ❤️">

    <meta name="theme-color"
          content="#f6a7c3">

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="background-glow"></div>


    <header class="title">

        <div class="small-title">
            A little something...
        </div>

        <h1>
            For My
            <span>Simui Rani</span> ❤️
        </h1>

        <p>
            A bouquet made with love, just for you 🌹
        </p>

    </header>


    <button id="musicBtn"
            class="top-button left-button">
        🎵 Music
    </button>


    <button id="openBtn"
            class="top-button right-button">
        🌹 Bloom
    </button>


    <main class="bouquet-container">

        <div class="bouquet"
             id="bouquet">

            <div class="flowers">

                <div class="stem stem1"></div>
                <div class="stem stem2"></div>
                <div class="stem stem3"></div>
                <div class="stem stem4"></div>
                <div class="stem stem5"></div>
                <div class="stem stem6"></div>
                <div class="stem stem7"></div>
                <div class="stem stem8"></div>


                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
                <div class="leaf leaf3"></div>
                <div class="leaf leaf4"></div>
                <div class="leaf leaf5"></div>
                <div class="leaf leaf6"></div>


                <!-- ROSE 1 -->

                <div class="flower rose red-rose rose1">

                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>

                    <span class="flower-center"></span>

                </div>


                <!-- ROSE 2 -->

                <div class="flower rose pink-rose rose2">

                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>

                    <span class="flower-center"></span>

                </div>


                <!-- ROSE 3 -->

                <div class="flower rose red-rose rose3">

                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>

                    <span class="flower-center"></span>

                </div>


                <!-- ROSE 4 -->

                <div class="flower rose deep-rose rose4">

                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>

                    <span class="flower-center"></span>

                </div>


                <!-- ROSE 5 -->

                <div class="flower rose pink-rose rose5">

                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>
                    <span class="petal"></span>

                    <span class="flower-center"></span>

                </div>


                <!-- EXTRA FLOWERS -->

                <div class="small-flower flower6">
                    🌸
                </div>

                <div class="small-flower flower7">
                    🌷
                </div>

                <div class="small-flower flower8">
                    🌺
                </div>

                <div class="small-flower flower9">
                    🌼
                </div>

            </div>


            <div class="wrapper">

                <div class="paper-line"></div>

                <div class="paper-line line2"></div>

            </div>


            <div class="ribbon">

                <div class="ribbon-left"></div>

                <div class="ribbon-right"></div>

                <div class="ribbon-center"></div>

            </div>

        </div>

    </main>


    <section class="message">

        <p>
            Every flower in this bouquet
            carries a little piece of my heart. ❤️
        </p>

        <h2>
            Keep smiling, Simui Rani 🌹
        </h2>

        <div class="heart-line">
            ♥ ♥ ♥
        </div>

    </section>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
